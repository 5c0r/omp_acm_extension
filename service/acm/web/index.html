<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACM Memory Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ACM Memory Console</h1>

    <section id="dashboard" class="view"></section>
    <section id="browse" class="view" hidden></section>
    <section id="detail" class="view" hidden></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
